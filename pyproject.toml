[project]
name = "stingray"
version = "0.2.7"
description = "Raspberry Pi 4 air-quality monitoring application (migrated from ESP32-S3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Hardware-only dependencies. Kept out of the base install so mock tests
# (and CI on non-Pi machines) never need I2C/SPI/GPIO libraries.
# Sensor driver libraries are added in Phase 05 (STG-013..016) only after their
# ARM64 support and APIs are verified and pinned. Do not guess package names.
hardware = [
    "RPi.GPIO>=0.7.1",
    "smbus2>=0.4",
    "spidev>=3.5",
]
# Alerts
alerts = [
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
stingray = "stingray.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stingray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/stubs"]
markers = [
    "hardware: tests that require physical sensor hardware",
]
addopts = "-m \"not hardware\""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
