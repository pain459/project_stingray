# Stingray application configuration
# Copy to application.yaml and adjust. Secrets go in .env, not here.

mode: mock            # mock | hardware

api:
  host: 0.0.0.0
  port: 8080

storage:
  path: /var/lib/stingray/parquet
  retention_days: 30

sensors:
  sht45:
    enabled: true
    i2c_bus: 1
    address: 0x44
    cadence_seconds: 5
  scd4x:
    enabled: true
    i2c_bus: 1
    address: 0x62
    cadence_seconds: 5
  sgp41:
    enabled: true
    i2c_bus: 1
    address: 0x59
    cadence_seconds: 1
  sps30:
    enabled: true
    i2c_bus: 1
    address: 0x69
    cadence_seconds: 10

display:
  enabled: true
  spi_device: /dev/spidev0.0
  rotation: 0
  refresh_seconds: 2

alerts:
  telegram:
    enabled: false
    cooldown_seconds: 300
  thresholds:
    pm2_5_ug_m3: 35.0
    co2_ppm: 1000
    voc_index: 100
    nox_index: 150
    rh_high_percent: 65
    rh_low_percent: 30
    temperature_high_c: 30

summary:
  enabled: false
  path: /var/lib/stingray/summaries
  model: qwen2.5:0.5b
  ollama_url: http://127.0.0.1:11434
  hours: 1

logging:
  level: INFO
  file: /var/log/stingray/stingray.log
