alerts:
  telegram:
    cooldown_seconds: 300
    enabled: true
  thresholds:
    co2_ppm: 1000
    nox_index: 150
    pm2_5_ug_m3: 35.0
    rh_high_percent: 65
    rh_low_percent: 30
    temperature_high_c: 30
    voc_index: 100
api:
  host: 0.0.0.0
  port: 8081
deploy:
  enabled: true
display:
  enabled: true
  refresh_seconds: 2
  rotation: 0
  spi_device: /dev/spidev0.0
logging:
  file: /var/log/stingray/stingray.log
  level: INFO
mode: hardware
sensors:
  scd4x:
    address: 98
    cadence_seconds: 5
    enabled: true
    i2c_bus: 1
  sgp41:
    address: 89
    cadence_seconds: 1
    enabled: true
    i2c_bus: 1
  sht45:
    address: 68
    cadence_seconds: 1
    enabled: true
    i2c_bus: 1
  sps30:
    address: 105
    cadence_seconds: 10
    enabled: true
    i2c_bus: 1
  pi:
    cadence_seconds: 30
    enabled: true
    thermal_path: /sys/class/thermal/thermal_zone0/temp
storage:
  path: /mnt/stingray/parquet
  retention_days: 30
summary:
  enabled: true
  hours: 1
  model: qwen2.5:0.5b
  ollama_url: http://127.0.0.1:11434
  path: /mnt/stingray/summaries
  refresh_cooldown_seconds: 600
