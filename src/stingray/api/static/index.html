<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stingray — Air Quality Monitor</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --accent: #58a6ff;
    --accent2: #bc8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  header h1 .dot { color: var(--accent); }
  .status {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .status .pill {
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--panel2);
    border: 1px solid var(--border);
  }
  .status .pill b { color: var(--text); font-weight: 600; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    display: inline-block;
    margin-right: 5px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  main { padding: 20px 22px 40px; max-width: 1400px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .card .sensor-name {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .card .metric-name {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .card .value {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .card .unit {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
    margin-left: 4px;
  }
  .card .meta {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card .quality {
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .quality.good { background: rgba(63,185,80,0.15); color: var(--good); }
  .quality.estimated { background: rgba(210,153,34,0.15); color: var(--warn); }
  .quality.stale { background: rgba(210,153,34,0.15); color: var(--warn); }
  .quality.invalid { background: rgba(248,81,73,0.15); color: var(--bad); }
  .card canvas {
    width: 100%;
    height: 36px;
    margin-top: 10px;
    display: block;
  }
  .card .state-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .state-ready { background: rgba(63,185,80,0.15); color: var(--good); }
  .state-degraded { background: rgba(210,153,34,0.15); color: var(--warn); }
  .state-failed, .state-disconnected { background: rgba(248,81,73,0.15); color: var(--bad); }
  .state-initializing, .state-stale { background: rgba(139,148,158,0.15); color: var(--muted); }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 26px 0 12px;
    font-weight: 600;
  }
  .health-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .health-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .health-card .hname {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .health-card .hrow {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
    font-variant-numeric: tabular-nums;
  }
  .health-card .hrow span:first-child { color: var(--muted); }
  .footer {
    margin-top: 30px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
  }
</style>
</head>
<body>
<header>
  <h1>Stingray <span class="dot">·</span> Air Quality Monitor</h1>
  <div class="status">
    <span class="pill"><span class="live-dot"></span><b>Live</b></span>
    <span class="pill">Uptime <b id="uptime">–</b></span>
    <span class="pill">Readings <b id="total">–</b></span>
    <span class="pill">Updated <b id="updated">–</b></span>
  </div>
</header>
<main>
  <div class="section-title">Live readings</div>
  <div class="grid" id="cards"></div>

  <div class="section-title">Scheduler health</div>
  <div class="health-grid" id="health"></div>

  <div class="footer">
    Stingray · mock mode · data refreshes every 2s · internal dashboard
  </div>
</main>

<script>
const METRIC_LABELS = {
  pm1_ug_m3: "PM1",
  pm2_5_ug_m3: "PM2.5",
  pm4_ug_m3: "PM4",
  pm10_ug_m3: "PM10",
  pm1_num_m3: "PM1 count",
  pm2_5_num_m3: "PM2.5 count",
  pm4_num_m3: "PM4 count",
  pm10_num_m3: "PM10 count",
  co2_ppm: "CO₂",
  temperature_c: "Temperature",
  relative_humidity_percent: "Humidity",
  voc_index: "VOC index",
  nox_index: "NOx index",
  voc_raw: "VOC raw",
  nox_raw: "NOx raw",
};
const SENSOR_LABELS = {
  sht45: "SHT45 · Temp/RH",
  scd4x: "SCD4X · CO₂",
  sgp41: "SGP41 · VOC/NOx",
  sps30: "SPS30 · Particulates",
};
const SENSOR_ORDER = ["sht45", "scd4x", "sgp41", "sps30"];
const METRIC_ORDER = [
  "temperature_c", "relative_humidity_percent", "co2_ppm",
  "voc_index", "nox_index", "voc_raw", "nox_raw",
  "pm2_5_ug_m3", "pm1_ug_m3", "pm4_ug_m3", "pm10_ug_m3",
  "pm2_5_num_m3", "pm1_num_m3", "pm4_num_m3", "pm10_num_m3",
];

// Per-metric sparkline history (value + timestamp)
const sparkData = {}; // key: sensor:metric -> [{t, v}]
const SPARK_MAX = 60;

function fmtTime(iso) {
  if (!iso) return "–";
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour12: false });
}
function fmtUptime(s) {
  if (s == null) return "–";
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}
function fmtVal(v) {
  if (v == null) return "–";
  if (Math.abs(v) >= 1000) return v.toFixed(0);
  if (Math.abs(v) >= 100) return v.toFixed(1);
  return v.toFixed(2);
}

function drawSpark(canvas, points) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.offsetWidth * (window.devicePixelRatio || 1);
  const h = canvas.height = 36 * (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);
  if (!points || points.length < 2) return;
  const vals = points.map(p => p.v);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = (max - min) || 1;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = (i / (points.length - 1)) * w;
    const y = h - ((p.v - min) / range) * (h - 4) - 2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = "#58a6ff";
  ctx.lineWidth = 1.5 * (window.devicePixelRatio || 1);
  ctx.stroke();
  // fill
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = "rgba(88,166,255,0.08)";
  ctx.fill();
}

function cardKey(sensor, metric) { return sensor + ":" + metric; }

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}

async function refresh() {
  try {
    const [live, health] = await Promise.all([
      fetchJSON("/api/live"),
      fetchJSON("/api/health"),
    ]);

    // Header
    document.getElementById("uptime").textContent = fmtUptime(health.uptime_seconds);
    document.getElementById("total").textContent = live.total;
    document.getElementById("updated").textContent = fmtTime(health.time);

    // Build a map of current live readings
    const liveMap = {};
    for (const row of live.live) {
      liveMap[cardKey(row.sensor, row.metric)] = row;
    }

    // Determine which cards to show: union of live readings and known sensors
    const cardsEl = document.getElementById("cards");
    const existing = new Map();
    for (const child of cardsEl.children) {
      existing.set(child.dataset.key, child);
    }

    // Collect all (sensor, metric) pairs present in live data
    const pairs = [];
    for (const row of live.live) pairs.push([row.sensor, row.metric]);
    // Sort by sensor order then metric order
    pairs.sort((a, b) => {
      const so = SENSOR_ORDER.indexOf(a[0]) - SENSOR_ORDER.indexOf(b[0]);
      if (so !== 0) return so;
      return METRIC_ORDER.indexOf(a[1]) - METRIC_ORDER.indexOf(b[1]);
    });

    const seen = new Set();
    for (const [sensor, metric] of pairs) {
      const key = cardKey(sensor, metric);
      seen.add(key);
      const row = liveMap[key];
      let card = existing.get(key);
      if (!card) {
        card = document.createElement("div");
        card.className = "card";
        card.dataset.key = key;
        card.innerHTML = `
          <div class="sensor-name">${SENSOR_LABELS[sensor] || sensor}</div>
          <div class="metric-name">${METRIC_LABELS[metric] || metric}</div>
          <div class="value"><span class="v">–</span><span class="unit"></span></div>
          <div class="meta"><span class="ts">–</span><span class="quality good">good</span></div>
          <canvas></canvas>
        `;
        cardsEl.appendChild(card);
        existing.set(key, card);
      }
      // Update values
      card.querySelector(".v").textContent = fmtVal(row.value);
      card.querySelector(".unit").textContent = row.unit;
      card.querySelector(".ts").textContent = fmtTime(row.observed_at);
      const q = card.querySelector(".quality");
      q.textContent = row.quality;
      q.className = "quality " + row.quality;

      // Sensor state badge
      const h = live.health[sensor];
      let badge = card.querySelector(".state-badge");
      if (h) {
        if (!badge) {
          badge = document.createElement("span");
          badge.className = "state-badge";
          card.appendChild(badge);
        }
        badge.textContent = h.state;
        badge.className = "state-badge state-" + h.state;
      }

      // Sparkline data
      const sparkKey = key;
      if (!sparkData[sparkKey]) sparkData[sparkKey] = [];
      const arr = sparkData[sparkKey];
      // Only push if the timestamp is newer than the last
      const last = arr.length ? arr[arr.length - 1] : null;
      if (!last || row.observed_at > last.t) {
        arr.push({ t: row.observed_at, v: row.value });
        if (arr.length > SPARK_MAX) arr.shift();
      }
      drawSpark(card.querySelector("canvas"), arr);
    }

    // Remove cards that are no longer present
    for (const [key, card] of existing) {
      if (!seen.has(key)) {
        card.remove();
        existing.delete(key);
      }
    }

    // Health section
    const healthEl = document.getElementById("health");
    healthEl.innerHTML = "";
    for (const sensor of Object.keys(health.stats)) {
      const s = health.stats[sensor];
      const div = document.createElement("div");
      div.className = "health-card";
      div.innerHTML = `
        <div class="hname">${SENSOR_LABELS[sensor] || sensor}</div>
        <div class="hrow"><span>Reads OK</span><span>${s.reads_ok}</span></div>
        <div class="hrow"><span>Reads failed</span><span>${s.reads_failed}</span></div>
        <div class="hrow"><span>Measurements</span><span>${s.measurements}</span></div>
        <div class="hrow"><span>Last error</span><span>${s.last_error || "–"}</span></div>
      `;
      healthEl.appendChild(div);
    }
  } catch (e) {
    console.error("refresh failed", e);
  }
}

refresh();
setInterval(refresh, 2000);
window.addEventListener("resize", () => {
  // Redraw sparklines on resize
  document.querySelectorAll(".card canvas").forEach(c => {
    const key = c.closest(".card").dataset.key;
    if (sparkData[key]) drawSpark(c, sparkData[key]);
  });
});
</script>
</body>
</html>
